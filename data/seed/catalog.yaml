# Curated seed catalog: programs and their application windows.
#
# Check it:  cd workers && uv run python -m internradar_ingest.seed_cli --check ../data/seed/catalog.yaml
# Load it:   SEED_DATABASE_URL=... uv run python -m internradar_ingest.seed_cli ../data/seed/catalog.yaml
#
# Rules for this file (see docs/ethics-policy.md):
#   - Key facts only, each taken from the employer's OWN page, never an aggregator. Every
#     program and window carries the page it came from in source_url.
#   - Every program below is UNVERIFIED and UNPUBLISHED. A person must open the source page,
#     check the facts, then add `verified_on: YYYY-MM-DD` and `is_published: true`. The parser
#     refuses is_published without verified_on.
#   - cycle_year is the year the program STARTS (decision D1). Dates with only a month use
#     precision "month" (the first of that month); a pattern the page states without a year
#     uses "estimated".
#   - Facts gathered 2026-10-03 with one polite request per page (robots.txt allowed it).
#
# Eligibility rules (decision D16): graduate programs use a graduationWindow, not a year-level
# preset, because they take recent graduates and a preset would call them ineligible. The window
# is absolute dates for ONE intake, derived from the page's wording ("within 24 months of
# applying", etc.) and the month applications open, so it must be re-derived each cycle and
# checked when verifying.
# Known gap: minimum WAM/GPA is not modelled yet (decision D15), so CommBank's "65 WAM" is a note.

companies:
  - slug: commbank
    name: Commonwealth Bank
    careers_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html
    programs:
      - slug: graduate-program
        name: CommBank Graduate Program
        program_type: graduate
        cities: [melbourne]
        disciplines: []
        source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html
        # Page: final year or completed within 24 months; 65 WAM (70 Technology: Engineering
        # and Cyber Security); AU/NZ citizen or AU PR (not bridging or 820 visas).
        eligibility_rules:
          schemaVersion: 1
          # Final year, or completed within 24 months of applying (March 2026): graduating Mar 2024 to Dec 2026.
          graduationWindow:
            earliest: {year: 2024, month: 3}
            latest: {year: 2026, month: 12}
          citizenship: {allowed: [au_citizen, au_pr, nz_citizen]}
        # Stages as CommBank's "How to apply" page describes them (read 2026-10-13).
        application_stages:
          - name: Online application
            description: A short form of about 10 minutes. Have your resume and latest transcript ready, and choose the area you are most interested in.
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs/how-to-apply.html
          - name: Online assessment
            description: If your application is successful you are invited to three assessments, a Talent Screener, Numerical Reasoning and Inductive Reasoning.
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs/how-to-apply.html
          - name: Digital interview
            description: Short pre-recorded questions answered to the camera on your computer or phone.
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs/how-to-apply.html
          - name: Assessment centre
            description: Group activities and interviews with business leaders, held virtually or in person.
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs/how-to-apply.html
        windows:
          # Page: "Applications open March and August", program starts mid-February after.
          - cycle_year: 2027
            status: unknown
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html
      - slug: summer-intern-program
        name: CommBank Summer Intern Program
        program_type: vacationer
        cities: [melbourne]
        disciplines: []
        source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html
        eligibility_rules:
          schemaVersion: 1
          yearLevel: {preset: penultimate}
          citizenship: {allowed: [au_citizen, au_pr, nz_citizen]}
        # CommBank's "How to apply" page gives one process for all its programs, graduate and
        # intern alike (read 2026-10-15), so the stages repeat the graduate row's. The page
        # adds extra team interviews for the Global Markets Summer Analyst program only.
        application_stages:
          - name: Online application
            description: A short form of about 10 minutes. Have your resume and latest transcript ready, and choose the area you are most interested in.
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs/how-to-apply.html
          - name: Online assessment
            description: If your application is successful you are invited to an online assessment that shows your strengths and capabilities.
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs/how-to-apply.html
          - name: Digital interview
            description: Short pre-recorded questions answered to the camera. You get an email invite with 48 hours to finish.
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs/how-to-apply.html
          - name: Assessment centre
            description: Activities and interviews with business leaders, held virtually or in person.
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs/how-to-apply.html
        windows:
          # Page: "Applications open 12 August to 8 September, 2026"; program November 2026
          # to January 2027.
          - cycle_year: 2026
            opens_on: 2026-08-12
            opens_precision: day
            closes_on: 2026-09-08
            closes_precision: day
            status: closed
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html


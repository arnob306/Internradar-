# Curated seed catalog: programs and their application windows.
#
# Check it:  cd workers && uv run python -m internradar_ingest.seed_cli --check ../data/seed/catalog.yaml
# Load it:   SEED_DATABASE_URL=... uv run python -m internradar_ingest.seed_cli ../data/seed/catalog.yaml
#
# Rules for this file (see docs/ethics-policy.md):
#   - Key facts only, each taken from the employer's OWN page, never an aggregator. Every
#     program and window carries the page it came from in source_url.
#   - Every program below is UNVERIFIED and UNPUBLISHED. A person must open the source page,
#     check the facts, then add `verified_on: YYYY-MM-DD` and `is_published: true`. The parser
#     refuses is_published without verified_on.
#   - cycle_year is the year the program STARTS (decision D1). Dates with only a month use
#     precision "month" (the first of that month); a pattern the page states without a year
#     uses "estimated".
#   - Facts gathered 2026-10-03 with one polite request per page (robots.txt allowed it).
#
# Known modelling gaps, so the eligibility rules below are deliberately partial:
#   - "Completed studies within the last 24 months" (or 3 or 4 years) is not expressible with
#     the final_year preset alone; graduationWindow needs absolute dates per cycle.
#   - Minimum WAM/GPA is not modelled yet (decision D15), so CommBank's "65 WAM" is a note.

companies:
  - slug: commbank
    name: Commonwealth Bank
    careers_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html
    programs:
      - slug: graduate-program
        name: CommBank Graduate Program
        program_type: graduate
        cities: [melbourne]
        disciplines: []
        source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html
        # Page: final year or completed within 24 months; 65 WAM (70 Technology: Engineering
        # and Cyber Security); AU/NZ citizen or AU PR (not bridging or 820 visas).
        eligibility_rules:
          schemaVersion: 1
          yearLevel: {preset: final_year}
          citizenship: {allowed: [au_citizen, au_pr, nz_citizen]}
        windows:
          # Page: "Applications open March and August", program starts mid-February after.
          - cycle_year: 2027
            status: unknown
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html
      - slug: summer-intern-program
        name: CommBank Summer Intern Program
        program_type: vacationer
        cities: [melbourne]
        disciplines: []
        source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html
        eligibility_rules:
          schemaVersion: 1
          yearLevel: {preset: penultimate}
          citizenship: {allowed: [au_citizen, au_pr, nz_citizen]}
        windows:
          # Page: "Applications open 12 August to 8 September, 2026"; program November 2026
          # to January 2027.
          - cycle_year: 2026
            opens_on: 2026-08-12
            opens_precision: day
            closes_on: 2026-09-08
            closes_precision: day
            status: closed
            source_url: https://www.commbank.com.au/about-us/careers/graduate-intern-programs.html


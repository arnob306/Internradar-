          # stated year or day, so it is not recorded as a window.
          - cycle_year: 2027
            window_seq: 2
            opens_on: 2026-07-01
            opens_precision: month
            closes_on: 2026-07-01
            closes_precision: month
            status: closed
            source_url: https://www.deloitte.com/au/en/careers/students/graduate-program-careers.html


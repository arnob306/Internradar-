[project]
name = "internradar-common"
version = "0.0.0"
description = "Shared worker code: clock, polite fetcher, logging"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "psycopg[binary]>=3.2",
    "tzdata>=2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internradar_common"]

[project]
name = "internradar-ingest"
version = "0.0.0"
description = "Seed loader and ATS ingestion (Greenhouse, Lever)"
requires-python = ">=3.13"
dependencies = [
    "internradar-common",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internradar_ingest"]

[tool.uv.sources]
internradar-common = { workspace = true }

[project]
name = "internradar-workers"
version = "0.0.0"
description = "Workspace root for the InternRadar Python workers"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "ingest", "monitor"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-socket>=0.7",
  "pytest-httpx>=0.35",
  "hypothesis>=6",
  "ruff>=0.9",
  "mypy>=1.14",
  "internradar-common",
  "internradar-ingest",
  "internradar-monitor",
]

[tool.uv.sources]
internradar-common = { workspace = true }
internradar-ingest = { workspace = true }
internradar-monitor = { workspace = true }

[tool.pytest.ini_options]
# No real network in tests. Unix sockets stay allowed; DB tests (marker "db")
# add their own allowance for the local Postgres host.
addopts = "--import-mode=importlib --disable-socket --allow-unix-socket -m 'not db'"
testpaths = ["common/tests", "ingest/tests", "monitor/tests"]
markers = ["db: needs the local Supabase Postgres"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# DTZ: no naive datetimes or direct clock reads (test plan §1).
select = ["E", "F", "I", "UP", "B", "DTZ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"

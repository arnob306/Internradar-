name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

# Jobs added by later phases: schema-contract (Phase 2), e2e (Phase 4),
# eval-smoke (Phase 6). Every job runs on every change for now;
# path filters come later, once the required-check names are stable.
jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: pip install actionlint-py==1.7.12.25
      - run: actionlint

  typescript:
    name: TypeScript (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Build the web app
        run: pnpm --filter @internradar/web build
      - name: Guard tests (lint rules)
        run: pnpm --filter @internradar/guards test

  database:
    name: Database (schema, RLS, pgTAP, worker tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies every migration)
        run: pnpm --filter @internradar/db db:start
      - name: Check the generated database types are current
        run: pnpm --filter @internradar/db types:check
      - name: Run pgTAP tests
        run: pnpm --filter @internradar/db test:db
      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: workers/uv.lock
      - name: Install worker dependencies
        working-directory: workers
        run: uv sync --locked
      # The worker code that talks to Postgres (claims, upsert, status rows) is only
      # exercised by tests marked "db", so the coverage gate lives here, on the full run
      # (-m "db or not db" overrides the default that deselects them).
      - name: Worker tests against the database, with the coverage gate
        working-directory: workers
        run: >
          uv run pytest -m "db or not db"
          --cov=internradar_common --cov=internradar_ingest --cov=internradar_monitor
          --cov-branch --cov-fail-under=90

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: workers/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy common/src ingest/src monitor/src
      # Tests that need Postgres are deselected here (the "db" marker) and run in the
      # database job, which also enforces the coverage gate on the combined run.
      - name: Tests (no database)
        run: uv run pytest

# Weekly update pull requests. Security alerts are separate and always on for public repos.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only (decision D14). Remove this
      # rule once a typescript-eslint release supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: uv
    directory: /workers
    schedule:
      interval: weekly
